# Dependabot Configuration
#
# References:
#
# - https://docs.github.com/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/configuration-options-for-dependency-updates

---
version: 2
updates:
  - package-ecosystem: github-actions
    commit-message:
      prefix: ci
      include: scope
    directory: /
    labels:
      - scope:dependencies
      - type:ci
    schedule:
      interval: daily
  - package-ecosystem: npm
    commit-message:
      prefix: build
      include: scope
    directory: /
    groups:
      commitlint:
        patterns:
          - '@commitlint/*'
      docmark:
        patterns:
          - '@flex-development/docmark'
          - '@flex-development/docmark-*'
      flex-development:
        patterns:
          - '@flex-development/*'
      mark:
        patterns:
          - '@flex-development/mark'
          - '@flex-development/mark-*'
      remark:
        patterns:
          - remark
          - remark-*
      vitest:
        patterns:
          - '@vitest/*'
          - vitest
    labels:
      - scope:dependencies
      - type:build
    schedule:
      interval: daily
